<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aforo Evento PRO</title>
    <style>
        :root {
            --hombres-color: #3B82F6; /* Azul */
            --mujeres-color: #EC4899; /* Rosa */
            --bg-cristal: rgba(20, 20, 25, 0.6);
            --borde-cristal: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* DISEÑO DE UNA SOLA CARA */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('wall_cont.jpg');
            background-size: cover;
            background-position: center;
            color: var(--text-color);
        }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); z-index: 1;
        }

        /* Tarjeta Glassmorphism */
        .tarjeta {
            position: relative; z-index: 2;
            background: var(--bg-cristal);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--borde-cristal);
            border-radius: 24px; padding: 30px;
            width: 95%; max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Controles Superiores: Cronómetro y Guardar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.4); padding: 10px 20px;
            border-radius: 12px; margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .crono-container { display: flex; align-items: center; gap: 10px; }
        .crono-display { font-family: monospace; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        
        .btn-crono, .btn-guardar {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 8px; padding: 8px 12px; cursor: pointer;
            transition: 0.2s; font-size: 0.9rem; font-weight: bold;
        }
        .btn-crono:hover, .btn-guardar:hover { background: rgba(255,255,255,0.25); }
        .btn-guardar { background: rgba(16, 185, 129, 0.3); border-color: rgba(16, 185, 129, 0.5); }
        .btn-guardar:hover { background: rgba(16, 185, 129, 0.6); }

        /* Contador Total */
        .total-container { text-align: center; margin-bottom: 30px; }
        .total-numero { font-size: 6rem; font-weight: 800; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .total-texto { font-size: 1.2rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-top: 5px; }

        /* Cuadrícula Hombres vs Mujeres */
        .grid-generos { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .caja-genero { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 20px 10px; text-align: center; }
        
        /* Estilos para las siluetas SVG */
        .icono-svg { width: 60px; height: 60px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); margin-bottom: 5px; }
        .svg-hombres { fill: var(--hombres-color); }
        .svg-mujeres { fill: var(--mujeres-color); }

        .titulo-genero { font-size: 1rem; letter-spacing: 1px; font-weight: bold; }
        .numero-genero { font-size: 3rem; font-weight: bold; margin: 10px 0; }

        /* Botones +1 y -1 */
        .botones { display: flex; justify-content: center; gap: 15px; }
        .btn-circular {
            border: none; border-radius: 50%; width: 45px; height: 45px;
            font-size: 1.5rem; font-weight: bold; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-circular:active:not(:disabled) { transform: scale(0.9); }
        .btn-sumar-h { background-color: var(--hombres-color); }
        .btn-sumar-h:hover:not(:disabled) { background-color: #2563EB; }
        .btn-sumar-m { background-color: var(--mujeres-color); }
        .btn-sumar-m:hover:not(:disabled) { background-color: #DB2777; }
        .btn-restar { background-color: transparent; border: 2px solid rgba(255, 255, 255, 0.3); }
        .btn-restar:hover:not(:disabled) { background-color: rgba(255, 255, 255, 0.1); }
        .btn-circular:disabled { opacity: 0.2; cursor: not-allowed; border-color: transparent; }

        /* SECCIÓN ESTADÍSTICAS */
        .stats-container { background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .stats-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa; margin-bottom: 10px; text-align: center; }
        
        .stats-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; display: flex; margin-bottom: 8px; }
        .stats-fill-h { background: var(--hombres-color); width: 0%; transition: width 0.4s ease; }
        .stats-fill-m { background: var(--mujeres-color); width: 0%; transition: width 0.4s ease; }
        
        .stats-labels { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold; }
        .color-h { color: #60A5FA; }
        .color-m { color: #F472B6; }
    </style>
</head>
<body>

    <div class="overlay"></div>
    
    <div class="tarjeta">
        
        <!-- BARRA SUPERIOR: Cronómetro y Botón Guardar -->
        <div class="top-bar">
            <div class="crono-container">
                <button class="btn-crono" id="btn-toggle-crono" onclick="toggleCrono()">▶ Iniciar</button>
                <div class="crono-display" id="display-crono">00:00</div>
            </div>
            <button class="btn-guardar" onclick="guardarResultados()">💾 Exportar</button>
        </div>

        <!-- CONTADOR TOTAL -->
        <div class="total-container">
            <div class="total-numero" id="total">0</div>
            <div class="total-texto" id="texto-personas">Personas</div>
        </div>

        <!-- CONTADORES DE GÉNERO -->
        <div class="grid-generos">
            
            <!-- CAJA HOMBRES -->
            <div class="caja-genero">
                <!-- Silueta SVG Hombre (Vector puro, no requiere imágenes) -->
                <svg class="icono-svg svg-hombres" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M14 7h-4C8.9 7 8 7.9 8 9v6h2v7h4v-7h2V9c0-1.1-.9-2-2-2zm-2-5.75c1.24 0 2.25 1.01 2.25 2.25s-1.01 2.25-2.25 2.25S9.75 4.74 9.75 3.5 10.76 1.25 12 1.25z"/>
                </svg>
                <div class="titulo-genero">HOMBRES</div>
                <div class="numero-genero" id="hombres">0</div>
                <div class="botones">
                    <button class="btn-circular btn-restar" id="btn-restar-h" onclick="modificar('hombres', -1)" disabled>−</button>
                    <button class="btn-circular btn-sumar-h" onclick="modificar('hombres', 1)">+</button>
                </div>
            </div>

            <!-- CAJA MUJERES -->
            <div class="caja-genero">
                <!-- Silueta SVG Mujer (Vector puro, no requiere imágenes) -->
                <svg class="icono-svg svg-mujeres" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M13.94 8.31C13.62 7.52 12.85 7 12 7s-1.62.52-1.94 1.31L7 16h3.5v6h3v-6H17l-3.06-7.69zM12 1.25c1.24 0 2.25 1.01 2.25 2.25S13.24 5.75 12 5.75 9.75 4.74 9.75 3.5 10.76 1.25 12 1.25z"/>
                </svg>
                <div class="titulo-genero">MUJERES</div>
                <div class="numero-genero" id="mujeres">0</div>
                <div class="botones">
                    <button class="btn-circular btn-restar" id="btn-restar-m" onclick="modificar('mujeres', -1)" disabled>−</button>
                    <button class="btn-circular btn-sumar-m" onclick="modificar('mujeres', 1)">+</button>
                </div>
            </div>

        </div>

        <!-- ESTADÍSTICAS VISUALES -->
        <div class="stats-container">
            <div class="stats-title">Distribución de Aforo</div>
            <div class="stats-bar">
                <div class="stats-fill-h" id="barra-h"></div>
                <div class="stats-fill-m" id="barra-m"></div>
            </div>
            <div class="stats-labels">
                <span class="color-h" id="pct-hombres">0% Hombres</span>
                <span class="color-m" id="pct-mujeres">0% Mujeres</span>
            </div>
        </div>

    </div>

    <script>
        // ESTADO DE LA APP
        let countHombres = 0;
        let countMujeres = 0;
        
        // VARIABLES DEL CRONÓMETRO
        let segundos = 0;
        let cronoActivo = false;
        let intervalo = null;

        // --- LÓGICA DEL CONTADOR ---
        function modificar(genero, cantidad) {
            if (genero === 'hombres' && countHombres + cantidad >= 0) {
                countHombres += cantidad;
            } else if (genero === 'mujeres' && countMujeres + cantidad >= 0) {
                countMujeres += cantidad;
            }
            actualizarPantalla();
        }

        function actualizarPantalla() {
            let total = countHombres + countMujeres;

            // 1. Actualizar números
            document.getElementById('total').innerText = total;
            document.getElementById('hombres').innerText = countHombres;
            document.getElementById('mujeres').innerText = countMujeres;

            // 2. Regla Gramatical
            document.getElementById('texto-personas').innerText = (total === 1) ? 'Persona' : 'Personas';

            // 3. Restricción Botones -1
            document.getElementById('btn-restar-h').disabled = (countHombres === 0);
            document.getElementById('btn-restar-m').disabled = (countMujeres === 0);

            // 4. Actualizar Estadísticas
            let pctH = 0;
            let pctM = 0;
            if (total > 0) {
                pctH = Math.round((countHombres / total) * 100);
                pctM = Math.round((countMujeres / total) * 100);
            }
            
            document.getElementById('barra-h').style.width = pctH + '%';
            document.getElementById('barra-m').style.width = pctM + '%';
            document.getElementById('pct-hombres').innerText = pctH + '% Hombres';
            document.getElementById('pct-mujeres').innerText = pctM + '% Mujeres';
        }

        // --- LÓGICA DEL CRONÓMETRO ---
        function toggleCrono() {
            const btn = document.getElementById('btn-toggle-crono');
            if (cronoActivo) {
                clearInterval(intervalo);
                btn.innerText = "▶ Reanudar";
                btn.style.color = "white";
            } else {
                intervalo = setInterval(actualizarCrono, 1000);
                btn.innerText = "⏸ Pausar";
                btn.style.color = "#FCA5A5";
            }
            cronoActivo = !cronoActivo;
        }

        function actualizarCrono() {
            segundos++;
            const m = String(Math.floor(segundos / 60)).padStart(2, '0');
            const s = String(segundos % 60).padStart(2, '0');
            document.getElementById('display-crono').innerText = `${m}:${s}`;
        }

        // --- LÓGICA PARA GUARDAR RESULTADOS ---
        function guardarResultados() {
            let total = countHombres + countMujeres;
            let pctH = total > 0 ? Math.round((countHombres / total) * 100) : 0;
            let pctM = total > 0 ? Math.round((countMujeres / total) * 100) : 0;
            let tiempo = document.getElementById('display-crono').innerText;

            let contenido = `==== REPORTE DE AFORO ====\n`;
            contenido += `Fecha: ${new Date().toLocaleDateString()} a las ${new Date().toLocaleTimeString()}\n`;
            contenido += `Tiempo de registro: ${tiempo}\n`;
            contenido += `==========================\n`;
            contenido += `TOTAL ASISTENTES: ${total}\n\n`;
            contenido += `ESTADÍSTICAS:\n`;
            contenido += `- Hombres: ${countHombres} (${pctH}%)\n`;
            contenido += `- Mujeres: ${countMujeres} (${pctM}%)\n`;
            contenido += `==========================\n`;

            const blob = new Blob([contenido], { type: 'text/plain' });
            const enlace = document.createElement('a');
            enlace.href = URL.createObjectURL(blob);
            enlace.download = `Reporte_Aforo_${Date.now()}.txt`;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        }
    </script>
</body>
</html>
